<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="light">

    <!-- ── TOP BAR ─────────────────────────────────────────── -->
    <header class="topbar">
      <div class="topbar-left">
        <span id="greeting-text">Good morning</span>,
        <span id="user-name" class="editable-name" title="Click to change name">Friend</span>
        <button id="edit-name-btn" class="icon-btn" title="Edit name">✏️</button>
      </div>
      <div class="topbar-center">
        <div id="current-time" class="clock">00:00:00</div>
        <div id="current-date" class="date-label">Monday, January 1</div>
      </div>
      <div class="topbar-right">
        <button id="theme-toggle" class="icon-btn" title="Toggle dark/light mode">🌙</button>
      </div>
    </header>

    <!-- ── NAME EDIT MODAL ──────────────────────────────────── -->
    <div id="name-modal" class="modal hidden">
      <div class="modal-box">
        <h3>What's your name?</h3>
        <input id="name-input" type="text" placeholder="Enter your name" maxlength="30" />
        <div class="modal-actions">
          <button id="name-save-btn" class="btn-primary">Save</button>
          <button id="name-cancel-btn" class="btn-ghost">Cancel</button>
        </div>
      </div>
    </div>

    <!-- ── MAIN GRID ─────────────────────────────────────────── -->
    <main class="grid">

      <!-- FOCUS TIMER -->
      <section class="card timer-card">
        <h2 class="card-title">⏱ Focus Timer</h2>
        <div id="timer-display" class="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="timer-start" class="btn-primary">Start</button>
          <button id="timer-stop" class="btn-secondary">Stop</button>
          <button id="timer-reset" class="btn-ghost">Reset</button>
        </div>
        <div class="timer-settings">
          <label for="pomodoro-minutes">Set minutes:</label>
          <input id="pomodoro-minutes" type="number" min="1" max="120" value="25" />
          <button id="pomodoro-set" class="btn-ghost">Apply</button>
        </div>
        <div id="timer-status" class="timer-status">Ready</div>
      </section>

      <!-- TO-DO LIST -->
      <section class="card todo-card">
        <h2 class="card-title">✅ To-Do List</h2>
        <div class="todo-input-row">
          <input id="todo-input" type="text" placeholder="Add a new task…" maxlength="120" />
          <button id="todo-add-btn" class="btn-primary">Add</button>
        </div>
        <ul id="todo-list" class="todo-list"></ul>
        <div id="todo-empty" class="empty-state">No tasks yet. Add one above!</div>
      </section>

      <!-- QUICK LINKS -->
      <section class="card links-card">
        <h2 class="card-title">🔗 Quick Links</h2>
        <div class="links-input-row">
          <input id="link-name-input" type="text" placeholder="Label" maxlength="30" />
          <input id="link-url-input" type="url" placeholder="https://…" maxlength="200" />
          <button id="link-add-btn" class="btn-primary">Add</button>
        </div>
        <div id="links-grid" class="links-grid"></div>
        <div id="links-empty" class="empty-state">No links yet. Add one above!</div>
      </section>

    </main>

    <script src="js/app.js"></script>
  </body>
</html>
